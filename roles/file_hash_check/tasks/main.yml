#         {%- endif -%}
#       {%- endfor -%}
#       {{ files_acc }}

- name: Compute MD5 per file on all hosts in parallel
  become: yes
  command: "md5sum {{ item.name }}"
  loop: "{{ my_files | default([]) }}"
  loop_control:
    label: "[{{ item.group }}] {{ item.name }}"
  register: md5_results
  changed_when: false
  when: file_hash_check_do_hashes

- name: Build result list on each host
  set_fact:
    md5_checked_files: >-
      {{
        (md5_checked_files | default([]))
        +
        [ {
            'name': item.item.name,
            'group': item.item.group,
            'expected': item.item.hash,
            'computed': (item.stdout.split()[0] if (item.stdout | default('')) | length > 0 else ''),
            'rc': item.rc,
            'finished': (item.rc == 0)
          } ]
      }}
  loop: "{{ md5_results.results | default([]) }}"
  when: 
    - file_hash_check_do_hashes
    - md5_results.results is defined

- name: Gather all results to coordinator host
  run_once: true
  delegate_to: "{{ groups['file_hash_check'][0] }}"
  set_fact:
    all_md5_results: >-
      {{
        groups['file_hash_check']

        | map('extract', hostvars, 'md5_checked_files')
        | select('defined')
        | list

        | flatten
      }}
  when: file_hash_check_do_hashes

- name: Validate all hashes and completeness
  run_once: true
  delegate_to: "{{ groups['file_hash_check'][0] }}"
  assert:
    that:
      - all_md5_results | length == hostvars[groups['file_hash_check'][0]]['flat_file_list'] | length
      - item.finished
      - item.rc == 0
      - item.computed == item.expected
    fail_msg: >-
      Hash check failed for group [{{ item.group | default('Unknown') }}]. 
      Problematic entry: {{ item.name | default('Unknown') }} (Expected: {{ item.expected | default('None') }}, Got: {{ item.computed | default('None') }})
    quiet: true
  loop: "{{ all_md5_results | default([]) }}"
  when: file_hash_check_do_hashes
