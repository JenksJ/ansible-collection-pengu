---
- name: Run setup tasks once 
  run_once: true
  delegate_to: "{{ groups['file_hash_check'][0] }}"
  block:
    - name: Make flat file list
      set_fact:
        flat_file_list: []

    - name: Flatten file dictionary and add group names 
      set_fact:
        flat_file_list: >-
          {{
            flat_file_list + 
            [ item.1 | combine({'group': item.0.key}) ]
          }}
      loop: "{{ file_hash_check_files | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1.name }}"

    - name: Stat files on the first host (no checksum)
      become: yes
      stat:
        path: "{{ item.name }}"
        get_checksum: false
        get_mime: false
      loop: "{{ flat_file_list }}"
      register: file_stats

    - name: Fail if any file is missing
      fail:
        msg: "File missing on source host: {{ item.item.name }} (Group: {{ item.item.group }})"
      when: item.stat.exists is not defined or not item.stat.exists
      loop: "{{ file_stats.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Sort files by size
      set_fact:
        sorted_file_list: >-
          {{
            file_stats.results
            | sort(attribute='stat.size', reverse=true)
            | map(attribute='item')
            | list
          }}

    - name: Build size-balanced distribution
      set_fact:
        distributed_files: |-
          {%- set hosts = groups['file_hash_check'] -%}
          
          {# Create a fast lookup map for file sizes #}
          {%- set size_map = {} -%}
          {%- for r in file_stats.results -%}
            {%- set _ = size_map.update({r.item.name: r.stat.size | default(0) | int}) -%}
          {%- endfor -%}

          {# Build initial empty structures safely using Jinja loops #}
          {%- set initial_sizes = {} -%}
          {%- set initial_files = {} -%}
          {%- for h in hosts -%}
            {%- set _ = initial_sizes.update({h: 0}) -%}
            {%- set _ = initial_files.update({h: []}) -%}
          {%- endfor -%}

          {# Place arrays into namespace to allow mutations to persist across loop steps #}
          {%- set ns = namespace(host_sizes=initial_sizes, host_files=initial_files) -%}

          {%- for file in sorted_file_list -%}
            {# Pick the host that currently has the smallest total file size payload #}
            {%- set target = (ns.host_sizes | dict2items | sort(attribute='value') | first).key -%}

            {# Assign the file array payload element to the selected target #}
            {%- set current_files = ns.host_files[target] -%}
            {%- set _ = ns.host_files.update({target: current_files + [file]}) -%}

            {# Update the cumulative tracked size metric for that target host #}
            {%- set file_size = size_map[file.name] | default(0) -%}
            {%- set _ = ns.host_sizes.update({target: ns.host_sizes[target] + file_size}) -%}
          {%- endfor -%}

          {{ ns.host_files }}

- name: Set per-host file list
  set_fact:
    my_files: >-
      {{
        hostvars[groups['file_hash_check'][0]].distributed_files[inventory_hostname]
        | default([])
      }}

# - debug:
#         msg: "my_files: {{ my_files }}"


